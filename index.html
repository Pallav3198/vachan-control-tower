<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>VACHAN Control Tower</title>
  <meta name="description" content="A playable prototype of an order-to-delivery control tower for steel. Simulated data.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231463D6'/%3E%3Cpath d='M8 8l8 17 8-17' fill='none' stroke='%23fff' stroke-width='3.6' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="top">
    <a class="brand" href="#today" aria-label="VACHAN home"><span class="mark">V</span><span><b>VACHAN</b><small>every promise, kept</small></span></a>
    <nav class="nav" id="nav" aria-label="Sections"></nav>
    <div class="live">
      <span class="pulse" id="pulse"></span><span id="clock"></span>
      <button class="round" data-act="playpause" id="pp" aria-label="Pause time"></button>
    </div>
  </header>
  <main id="main" tabindex="-1"></main>
  <footer class="foot">A student prototype for the Steel-a-thon XIII Sales Planning case. Every order and customer here is made up, and the rupee values use the case's illustrative numbers. Not a Tata Steel product. <button class="link" data-act="reset">Start over</button></footer>
  <aside class="drawer" id="drawer" aria-hidden="true"></aside>
  <div class="scrim" id="scrim" data-act="close"></div>
  <div class="story" id="story" role="dialog" aria-modal="true" aria-label="Mission"></div>
  <div class="tip" id="tip" role="status"></div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <div class="confetti" id="confetti" aria-hidden="true"></div>
  <script src="js/india-map.js"></script>
  <script src="js/model.js"></script>
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
