<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>VACHAN Fulfilment Control Tower</title>
  <meta name="description" content="Working prototype of an order-to-delivery control tower for steel sales planning. Simulated data.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%230F2D5C'/%3E%3Cpath d='M8 8l8 17 8-17' fill='none' stroke='%23fff' stroke-width='3.4'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="top">
    <div class="brand"><b>VACHAN</b><span>Fulfilment Control Tower</span></div>
    <div class="clock" id="clock"></div>
    <label class="role">Viewing as
      <select id="role" aria-label="Role"></select>
    </label>
    <button class="btn ghost" data-act="tick" data-h="1">+1 hour</button>
    <button class="btn ghost" data-act="tick" data-h="6">+6 hours</button>
    <button class="btn ghost" data-act="reset">Reset demo</button>
  </header>
  <nav class="nav" id="nav" aria-label="Screens"></nav>
  <main id="main" tabindex="-1"></main>
  <footer class="foot">Student prototype built for the Steel-a-thon XIII Sales Planning case. All orders and customers are simulated, and rupee values use the case's illustrative economics. Not a Tata Steel product or system.</footer>
  <aside class="drawer" id="drawer" aria-hidden="true"></aside>
  <div class="scrim" id="scrim" data-act="close"></div>
  <div class="tip" id="tip" role="status"></div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="js/india-map.js"></script>
  <script src="js/model.js"></script>
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
